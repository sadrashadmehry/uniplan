server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 1m;
    client_body_timeout 15s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /api/import-courses {
        client_max_body_size 8m;
        client_body_timeout 15s;
        client_body_buffer_size 128k;
        limit_req zone=uniplan_uploads burst=3 nodelay;
        limit_req_status 429;
        limit_conn uniplan_upload_connections 2;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
        proxy_send_timeout 15s;
    }

    # /api/schedule/export is called only by the Telegram bot, over
    # 127.0.0.1:3000 directly (see bot/course-schedule-bot/render/website_export.py).
    # It has no reason to be reachable from the public internet, so it is
    # blocked here before it ever reaches Next.js. The route's own
    # SCHEDULE_EXPORT_TOKEN check is defense in depth, not the primary guard.
    location = /api/schedule/export {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
